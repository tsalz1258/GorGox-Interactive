[package]
name = "gorgox_interactive"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework and async runtime
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }

# HTTP client (Meshy API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Load `.env` into process env (e.g. MESHY_API_KEY)
dotenvy = "0.15"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.21"
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Browser opening
open = "5.0"

[dev-dependencies]

[profile.release]
# Reduce file locking issues with incremental builds
incremental = false
# Use fewer threads to reduce file contention
codegen-units = 1