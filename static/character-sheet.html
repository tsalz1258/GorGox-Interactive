<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Sheet - Gorgox Interactive</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .character-sheet-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #444;
        }
        .header h1 {
            margin: 0;
            color: #4a9eff;
        }
        .refresh-btn {
            background: #4a9eff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background: #3a8eef;
        }
        #characterSheetContent {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 20px;
        }
        .error-message {
            text-align: center;
            padding: 40px;
            color: #ff4444;
            font-size: 18px;
        }
        .loading-message {
            text-align: center;
            padding: 40px;
            color: #ffaa44;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="character-sheet-container">
        <div class="header">
            <h1 id="sheetTitle">Character Sheet</h1>
            <button class="refresh-btn" onclick="refreshCharacterSheet()">🔄 Refresh</button>
        </div>
        <div id="characterSheetContent">
            <div class="loading-message">Loading character sheet...</div>
        </div>
    </div>

    <!-- Spell Tooltip (needed for spell/ability tooltips) -->
    <div id="spellTooltip" onmouseover="keepSpellTooltip()" onmouseout="hideSpellTooltip()" style="
        display: none; 
        position: fixed; 
        background: linear-gradient(135deg, #2a1a4a 0%, #1a0a2e 100%); 
        border: 2px solid #aa88ff; 
        border-radius: 8px; 
        padding: 15px; 
        max-width: 400px; 
        min-width: 250px;
        z-index: 99999; 
        box-shadow: 0 8px 32px rgba(170,136,255,0.5); 
        color: #fff; 
        font-size: 13px; 
        line-height: 1.6;
        pointer-events: auto;">
        <div id="spellTooltipContent">Loading...</div>
        <div style="text-align: center; font-size: 10px; opacity: 0.5; margin-top: 10px;">📚 Powered by Open5e API</div>
    </div>

    <script>
        // Standalone character sheet: all clickable roll/tooltip handlers run here and forward to parent via postMessage.
        // Do NOT load app.js in this window so these handlers are never overwritten.

        function sendRollToParent(rollType, params) {
            const parent = window.opener;
            if (parent && parent !== window && !parent.closed) {
                parent.postMessage({
                    type: 'characterSheetRoll',
                    rollType: rollType,
                    ...params
                }, window.location.origin);
                return true;
            }
            console.warn('⚠️ Parent window not available');
            alert('⚠️ Cannot roll dice: Parent game window is not available. Please keep the main game window open.');
            return false;
        }

        // Roll handlers (forward to parent)
        window.rollAbilityCheck = function(ability, modifier, characterName) {
            sendRollToParent('abilityCheck', { ability, modifier, characterName });
        };
        window.rollSavingThrow = function(ability, modifier, characterName) {
            sendRollToParent('savingThrow', { ability, modifier, characterName });
        };
        window.rollSkill = function(skillName, modifier, characterName) {
            sendRollToParent('skill', { skillName, modifier, characterName });
        };
        window.rollAttack = function(weaponName, toHitMod, damageNotation, damageType, characterName) {
            sendRollToParent('attack', { weaponName, toHitMod, damageNotation, damageType, characterName });
        };
        window.rollActionFromSheet = function(index) {
            sendRollToParent('actionFromSheet', { index: index });
        };
        window.resetLegendaryActions = function(enemyId, storageKey) {
            sendRollToParent('resetLegendaryActions', { enemyId: enemyId, storageKey: storageKey });
        };

        // rollDice: run locally so inline onclicks like "const dmgResult = rollDice('2d6'); addLogEntry(...)" work; addLogEntry sends to parent
        window.rollDice = function(notation) {
            const flatMatch = (notation || '').match(/^(\d+)$/);
            if (flatMatch) {
                return { total: parseInt(flatMatch[1], 10), rolls: [], breakdown: String(notation) };
            }
            const match = (notation || '').match(/(\d+)d(\d+)([+-]\d+)?/i);
            if (!match) {
                return { total: 0, rolls: [], breakdown: String(notation) };
            }
            const numDice = parseInt(match[1], 10);
            const diceSize = parseInt(match[2], 10);
            const modifier = match[3] ? parseInt(match[3], 10) : 0;
            let rolls = [];
            let total = modifier;
            for (let i = 0; i < numDice; i++) {
                const r = Math.floor(Math.random() * diceSize) + 1;
                rolls.push(r);
                total += r;
            }
            const breakdown = '(' + rolls.join('+') + ')' + (modifier !== 0 ? (modifier >= 0 ? '+' + modifier : modifier) : '') + ' = ' + total;
            return { total, rolls, breakdown };
        };
        window.addLogEntry = function(text, type) {
            sendRollToParent('addLogEntry', { text: String(text), type: type || 'info' });
        };

        // Tooltips: show in this window (no app.js dependency)
        let spellTooltipTimeout = null;
        window.showSpellTooltip = function(spellName, event) {
            const tooltip = document.getElementById('spellTooltip');
            const content = document.getElementById('spellTooltipContent');
            if (!tooltip || !content) return;
            if (spellTooltipTimeout) {
                clearTimeout(spellTooltipTimeout);
                spellTooltipTimeout = null;
            }
            content.innerHTML = '<div style="padding:12px; white-space:pre-wrap;">' + escapeHtml(spellName) + '</div>';
            tooltip.style.display = 'block';
            tooltip.style.left = (event.clientX + 15) + 'px';
            tooltip.style.top = (event.clientY + 15) + 'px';
        };
        window.showAttackTooltip = function(description, event) {
            const tooltip = document.getElementById('spellTooltip');
            const content = document.getElementById('spellTooltipContent');
            if (!tooltip || !content) return;
            if (spellTooltipTimeout) {
                clearTimeout(spellTooltipTimeout);
                spellTooltipTimeout = null;
            }
            content.innerHTML = '<div style="padding:12px; white-space:pre-wrap; max-width:400px;">' + escapeHtml(description) + '</div>';
            tooltip.style.display = 'block';
            tooltip.style.left = (event.clientX + 15) + 'px';
            tooltip.style.top = (event.clientY + 15) + 'px';
        };
        window.hideSpellTooltip = function() {
            const tooltip = document.getElementById('spellTooltip');
            if (!tooltip) return;
            spellTooltipTimeout = setTimeout(function() {
                tooltip.style.display = 'none';
                spellTooltipTimeout = null;
            }, 150);
        };
        window.keepSpellTooltip = function() {
            if (spellTooltipTimeout) {
                clearTimeout(spellTooltipTimeout);
                spellTooltipTimeout = null;
            }
        };
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Character sheet data and load (no app.js – we always use stored HTML from parent)
        let characterData = null;
        let characterFullData = null;
        let lastTimestamp = 0;

        function loadCharacterSheet() {
            try {
                const stored = sessionStorage.getItem('characterSheetData');
                if (!stored) {
                    document.getElementById('characterSheetContent').innerHTML = 
                        '<div class="error-message">❌ No character data found. Please open the character sheet from the main game window.</div>';
                    return;
                }

                const data = JSON.parse(stored);
                characterData = data.character;
                characterFullData = data.fullData || data.characterData;

                if (!characterData) {
                    document.getElementById('characterSheetContent').innerHTML = 
                        '<div class="error-message">❌ Invalid character data.</div>';
                    return;
                }

                // Set title
                document.getElementById('sheetTitle').textContent = `${characterData.name} - Character Sheet`;

                // If HTML is already rendered, use it directly (preferred method)
                if (data.html) {
                    document.getElementById('characterSheetContent').innerHTML = data.html;
                    lastTimestamp = data.timestamp || 0;
                    setupDiceRollButtonsInStandalone();
                } else {
                    // Fallback: try to render using functions from app.js
                    renderStandaloneCharacterSheet();
                }
            } catch (e) {
                console.error('Error loading character sheet:', e);
                document.getElementById('characterSheetContent').innerHTML = 
                    '<div class="error-message">❌ Error loading character sheet: ' + e.message + '</div>';
            }
        }

        function renderStandaloneCharacterSheet() {
            // Standalone page does not load app.js; use simple fallback if no stored HTML
            if (!characterData) {
                document.getElementById('characterSheetContent').innerHTML =
                    '<div class="error-message">❌ No character data available.</div>';
                return;
            }
            renderSimpleCharacterSheet();
        }

        function renderSimpleCharacterSheet() {
            const char = characterData;

            if (!char) return;

            let html = `
                <div style="background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h2 style="color: #4a9eff; margin-top: 0;">${escapeHtml(char.name || 'Unknown')}</h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                        <div><strong>Class:</strong> ${escapeHtml(char.class || 'N/A')}</div>
                        <div><strong>Level:</strong> ${char.level || 0}</div>
                        <div><strong>HP:</strong> ${char.current_hp || 0} / ${char.max_hp || 0}</div>
                        <div><strong>AC:</strong> ${char.armor_class || 0}</div>
                    </div>
                </div>
                <div style="color: #ffaa44; text-align: center; padding: 20px;">
                    ⚠️ Full character sheet rendering requires the main game window.<br>
                    Please keep the main game window open and refresh this page to see updates.
                </div>
            `;

            document.getElementById('characterSheetContent').innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function refreshCharacterSheet() {
            // Reload from sessionStorage (parent window should update it)
            loadCharacterSheet();
        }

        // Dice tray (D4, D6, D8, D10, D12, D20, D100): wire clicks so they run in parent
        function setupDiceRollButtonsInStandalone() {
            const content = document.getElementById('characterSheetContent');
            if (!content) return;
            const container = content.querySelector('.dice-roll-container');
            if (!container) return;
            const characterName = container.getAttribute('data-character-name') || (characterData && characterData.name) || 'Character';
            container.addEventListener('click', function(e) {
                const btn = e.target.closest('.dice-roll-button');
                if (!btn) return;
                e.preventDefault();
                e.stopPropagation();
                const sides = parseInt(btn.getAttribute('data-sides'), 10);
                const name = container.getAttribute('data-character-name') || characterName;
                if (sides && name) sendRollToParent('flatDice', { sides: sides, characterName: name });
            });
        }

        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            // Only accept messages from same origin
            if (event.origin !== window.location.origin) return;
            
            if (event.data && event.data.type === 'characterSheetUpdate') {
                // Update character sheet data
                const data = event.data.characterData;
                if (data) {
                    sessionStorage.setItem('characterSheetData', JSON.stringify(data));
                    loadCharacterSheet();
                }
            }
        });

        // Load on page load (after app.js is loaded)
        window.addEventListener('load', () => {
            // Wait a bit for app.js to fully load
            setTimeout(() => {
                loadCharacterSheet();
            }, 100);
        });

        // Poll for updates every 2 seconds (since storage events don't work for same-origin)
        setInterval(() => {
            const stored = sessionStorage.getItem('characterSheetData');
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    // Refresh if timestamp changed (meaning the sheet was updated)
                    if (data.timestamp && data.timestamp !== lastTimestamp) {
                        lastTimestamp = data.timestamp;
                        loadCharacterSheet();
                    }
                } catch (e) {
                    // Ignore parse errors
                }
            }
        }, 2000);
    </script>
</body>
</html>
